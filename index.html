<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <div id="content-box">
        <h1>Love Calculator</h1>
        <p>Masukan nama kamu dan nama pasangan kamu, untuk seberapa cocok kamu dengan pasangan kamu!!!</p>
        <br>
        <label for="your-name">Nama Kamu:</label>
        <input type="text" id="your-name" name="your-name"><br><br>
        <label for="crush-name">Nama Pasangan:</label>
        <input type="text" name="crush-name" id="crush-name"><br><br>

        <button id="calculate">Calculate</button>


        <h2 id="result-message"></h2>
        <p id="result-percentage"></p>
    </div>

    <script src="js/script.js"></script>
</body>

</html>

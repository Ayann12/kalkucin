<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Love Calculator ❤️</title>
</head>

<body>

    <div id="content-box">

        <div class="heart">❤️</div>

        <h1>Love Calculator</h1>

        <p class="description">
            Masukkan nama kamu dan nama pasanganmu
            untuk mengetahui seberapa cocok kalian berdua! 💕
        </p>

        <!-- Nama Kamu -->
        <div class="form-group">
            <label for="your-name">Nama Kamu</label>

            <input type="text" id="your-name" name="your-name" placeholder="Masukkan nama kamu..." autocomplete="off">
        </div>

        <!-- Nama Pasangan -->
        <div class="form-group">
            <label for="crush-name">Nama Pasangan</label>

            <input type="text" id="crush-name" name="crush-name" placeholder="Masukkan nama pasangan..."
                autocomplete="off">
        </div>

        <!-- Calculate Button -->
        <button id="calculate">
            💕 Calculate Love
        </button>

        <!-- Reset Button -->
        <button id="reset">
            🔄 Reset
        </button>

        <!-- Result -->
        <div id="result">

            <h2 id="result-message"></h2>

            <p id="result-percentage"></p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
